services:
  app:
    image: ghcr.io/aadyc13/2026-xrpl-hackathon-team-project:${IMAGE_TAG:-latest}
    env_file:
      - .env
    ports:
      - "127.0.1.3:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
