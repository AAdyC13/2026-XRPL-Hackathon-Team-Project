name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/xrpl-team-project
  GHCR_REGISTRY: ghcr.io

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gkc
          POSTGRES_PASSWORD: gkc
          POSTGRES_DB: gkc_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gkc -d gkc_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gkc:gkc@localhost:5432/gkc_platform_test
      JWT_SECRET: minimum_32_character_random_secret_for_tests_only
      JWT_EXPIRES_IN: "86400"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Type check backend
        run: pnpm check:backend

      - name: Run tests
        run: pnpm test:ci

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build-and-push]

    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${SSH_HOST}
            User ${SSH_USERNAME}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare deploy files
        run: |
          printf 'IMAGE_TAG=%s\n' "${GITHUB_SHA}" > deploy.env

      - name: Copy compose files
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "mkdir -p '${DEPLOY_DIR}'"
          scp docker-compose.yml deploy.env "vps:${DEPLOY_DIR}/"

      - name: Pull image and restart service
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"
          # shellcheck disable=SC2029
          ssh vps "cd '${DEPLOY_DIR}' && docker compose --env-file deploy.env pull && docker compose --env-file deploy.env up -d --remove-orphans && docker image prune -f && docker logout ghcr.io"
