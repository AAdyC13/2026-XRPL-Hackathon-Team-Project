name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/xrpl-team-project
  GHCR_REGISTRY: ghcr.io

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gkc
          POSTGRES_PASSWORD: gkc
          POSTGRES_DB: gkc_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gkc -d gkc_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gkc:gkc@localhost:5432/gkc_platform_test
      JWT_SECRET: minimum_32_character_random_secret_for_tests_only
      JWT_EXPIRES_IN: "86400"
      GKC_ISSUER_ADDRESS: rTEST_ISSUER_ADDRESS
      GKC_ISSUER_SEED: sEd_TEST_SEED_NOT_REAL
      PLATFORM_ADDRESS: rTEST_PLATFORM_ADDRESS
      PLATFORM_SEED: sEd_TEST_PLATFORM_SEED
      GKC_CURRENCY: GKC
      DEFAULT_TRUST_LIMIT: "10000000"
      XRPL_WSS: wss://s.altnet.rippletest.net:51233
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Type check
        run: pnpm check

      - name: API tests
        run: pnpm test:api

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build-and-push]
    timeout-minutes: 20
    env:
      DEPLOY_UP_RETRIES: 3
      DEPLOY_UP_RETRY_INTERVAL: 30

    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${SSH_HOST}
            User ${SSH_USERNAME}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare deploy files
        run: |
          printf 'IMAGE_TAG=%s\nCOMPOSE_PROFILES=admin\n' "${GITHUB_SHA}" > deploy.env

      - name: Prepare remote deploy directory
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "mkdir -p '${DEPLOY_DIR}/scripts'"

      - name: Copy deploy helper
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          scp scripts/vps-post-deploy.sh "vps:${DEPLOY_DIR}/scripts/vps-post-deploy.sh"
          # shellcheck disable=SC2029
          ssh vps "chmod +x '${DEPLOY_DIR}/scripts/vps-post-deploy.sh'"

      - name: Save previous deploy tag
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "DEPLOY_DIR='${DEPLOY_DIR}' bash '${DEPLOY_DIR}/scripts/vps-post-deploy.sh' save-previous"

      - name: Copy compose files
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          scp docker-compose.yml deploy.env "vps:${DEPLOY_DIR}/"

      - name: Pull image and restart service
        id: deploy_up
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

          deploy_up_cmd="rm -f '${DEPLOY_DIR}/docker-compose.override.yml' && DEPLOY_DIR='${DEPLOY_DIR}' bash '${DEPLOY_DIR}/scripts/vps-post-deploy.sh' up"

          for attempt in $(seq 1 "$DEPLOY_UP_RETRIES"); do
            echo "Deploy up attempt ${attempt}/${DEPLOY_UP_RETRIES}"
            # shellcheck disable=SC2029
            if ssh vps "$deploy_up_cmd"; then
              echo "Deploy up succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt "$DEPLOY_UP_RETRIES" ]; then
              echo "Deploy up failed on attempt ${attempt}; retrying in ${DEPLOY_UP_RETRY_INTERVAL}s..."
              sleep "$DEPLOY_UP_RETRY_INTERVAL"
            fi
          done

          echo "Deploy up failed after ${DEPLOY_UP_RETRIES} attempts"
          exit 1

      - name: Verify deployed service
        id: verify
        if: steps.deploy_up.outcome == 'success'
        continue-on-error: true
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "DEPLOY_DIR='${DEPLOY_DIR}' bash '${DEPLOY_DIR}/scripts/vps-post-deploy.sh' verify"

      - name: Roll back failed deployment
        if: always() && (steps.deploy_up.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"
          # shellcheck disable=SC2029
          ssh vps "DEPLOY_DIR='${DEPLOY_DIR}' bash '${DEPLOY_DIR}/scripts/vps-post-deploy.sh' rollback"

      - name: Promote deploy tag
        if: always() && steps.deploy_up.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "DEPLOY_DIR='${DEPLOY_DIR}' bash '${DEPLOY_DIR}/scripts/vps-post-deploy.sh' promote-previous"

      - name: Cleanup deploy session
        if: always()
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "docker image prune -f && docker logout ghcr.io || true"

      - name: Fail after rollback
        if: always() && (steps.deploy_up.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          if [ "${{ steps.deploy_up.outcome }}" = "failure" ]; then
            echo "Deploy up (pull/restart) failed after ${DEPLOY_UP_RETRIES} attempts. Rollback was attempted to restore deploy.env and the previous image."
          else
            echo "Post-deploy verification failed. Rollback was attempted; inspect the deploy logs above for the active tag and health output."
          fi
          exit 1
