name: Deploy Frontend (port 3001)

on:
  push:
    branches:
      - frontend
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/xrpl-frontend
  FRONTEND_IMAGE: ghcr.io/aadyc13/2026-xrpl-hackathon-team-project-frontend

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend branch
        uses: actions/checkout@v4
        with:
          ref: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${SSH_HOST}
            User ${SSH_USERNAME}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Generate compose file and deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          cat > docker-compose.frontend.yml <<EOF
          services:
            frontend:
              image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
              ports:
                - "127.0.1.3:3001:3001"
              environment:
                NODE_ENV: production
                PORT: 3001
              restart: unless-stopped
          EOF

          ssh vps "mkdir -p '${DEPLOY_DIR}'"
          scp docker-compose.frontend.yml "vps:${DEPLOY_DIR}/"
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"
          ssh vps "cd '${DEPLOY_DIR}' && docker compose -f docker-compose.frontend.yml pull && docker compose -f docker-compose.frontend.yml up -d --remove-orphans && docker image prune -f && docker logout ghcr.io"
